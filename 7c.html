<!DOCTYPE html>
<html>
<body>

<script>

let fruits = ["Apple","Mango","Banana"];

document.write("Length: " + fruits.length + "<br>");

fruits.push("Orange");   // add element

document.write("After Push: " + fruits + "<br>");

fruits.pop();  // remove element

document.write("After Pop: " + fruits);

</script>

</body>
</html>
