<!DOCTYPE html>
<html>
<head>
    <title>BTS ARMY Web Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to bottom, #6A0DAD, #E6CCFF);
            color: white;
        }

        header {
            padding: 30px;
            font-size: 36px;
            font-weight: bold;
        }

        nav {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 15px;
        }

        nav a {
            color: #E6CCFF;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: white;
        }

        .content {
            padding: 40px;
        }

        .member-card {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 20px;
            margin: 15px;
            border-radius: 15px;
            width: 200px;
            transition: transform 0.3s;
        }

        .member-card:hover {
            transform: scale(1.1);
        }

        footer {
            background-color: #4B0082;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    💜 BTS – Bangtan Sonyeondan 💜
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Members</a>
    <a href="#">Albums</a>
    <a href="#">Contact</a>
</nav>

<div class="content">
    <h2>Meet the Members</h2>

    <div class="member-card">
        RM <br> Leader
    </div>

    <div class="member-card">
        Jin <br> Visual
    </div>

    <div class="member-card">
        Suga <br> Rapper
    </div>

    <div class="member-card">
        J-Hope <br> Dancer
    </div>

    <div class="member-card">
        Jimin <br> Vocalist
    </div>

    <div class="member-card">
        V <br> Vocalist
    </div>

    <div class="member-card">
        Jungkook <br> Main Vocalist
    </div>
</div>

<footer>
    Made with 💜 by ARMY
</footer>

</body>
</html>
