<!DOCTYPE html>
<html>
<head>
    <title>Image Mapping Example</title>
</head>
<body>

<h3>BTS Image Mapping</h3>

<img src="bts.jpg" width="400" height="700" usemap="#btsmap">

<map name="btsmap">

    <!-- Top Left -->
    <area shape="rect" coords="20,150,120,300"
          href="https://www.bts-official.us"
          target="_blank">

    <!-- Top Middle -->
    <area shape="rect" coords="130,150,230,300"
          href="https://en.wikipedia.org/wiki/BTS"
          target="_blank">

    <!-- Top Right (Bangtan) -->
    <area shape="rect" coords="240,150,360,300"
          href="https://bangtan.kpopprofile.com"
          target="_blank">

    <!-- Bottom Left -->
    <area shape="rect" coords="80,350,200,520"
          href="https://www.weverse.io/bts"
          target="_blank">

    <!-- Bottom Right -->
    <area shape="rect" coords="210,350,340,520"
          href="https://music.youtube.com/channel/UC3IZKseVpdzPSBaWxBxundA"
          target="_blank">

</map>

</body>
</html>
