<!DOCTYPE html>
<html>
<head>
    <title>Number Operations</title>
</head>
<body>

<h2>Enter a Number:</h2>
<input type="number" id="num">

<br><br>

<button onclick="factorial()">Factorial</button>
<button onclick="fibonacci()">Fibonacci</button>
<button onclick="prime()">Prime</button>
<button onclick="palindrome()">Palindrome</button>

<h3 id="result"></h3>

<script>
    function getInput() {
        return parseInt(document.getElementById("num").value);
    }

    
    function factorial() {
        let n = getInput();
        let fact = 1;

        for (let i = 1; i <= n; i++) {
            fact *= i;
        }

        document.getElementById("result").innerHTML = "Factorial: " + fact;
    }

    
    function fibonacci() {
        let n = getInput();
        let a = 0, b = 1, result = "Fibonacci: ";

        while (a <= n) {
            result += a + " ";
            let temp = a + b;
            a = b;
            b = temp;
        }

        document.getElementById("result").innerHTML = result;
    }

    
    function prime() {
        let n = getInput();
        let result = "Prime numbers: ";

        for (let i = 2; i <= n; i++) {
            let isPrime = true;

            for (let j = 2; j <= Math.sqrt(i); j++) {
                if (i % j === 0) {
                    isPrime = false;
                    break;
                }
            }

            if (isPrime) {
                result += i + " ";
            }
        }

        document.getElementById("result").innerHTML = result;
    }

   
    function palindrome() {
        let n = getInput();
        let original = n;
        let reverse = 0;

        while (n > 0) {
            let digit = n % 10;
            reverse = reverse * 10 + digit;
            n = Math.floor(n / 10);
        }

        if (original === reverse) {
            document.getElementById("result").innerHTML = original + " is a Palindrome";
        } else {
            document.getElementById("result").innerHTML = original + " is NOT a Palindrome";
        }
    }
</script>

</body>
</html>
