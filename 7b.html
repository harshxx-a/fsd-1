<!DOCTYPE html>
<html>
<head>
<title>Window Object</title>
</head>
<body>

<button onclick="showMessage()">Click Me</button>

<script>
function showMessage()
{
    alert("Welcome to JavaScript");   // window method
    console.log(window.innerHeight);  // property
    console.log(window.innerWidth);   // property
}
</script>

</body>
</html>
