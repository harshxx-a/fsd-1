<!DOCTYPE html>
<html>
<head>
    <title>Week Days</title>
</head>
<body>

<script>
   
    let day = parseInt(prompt("Enter a number (1-7):"));

    switch(day) {
        case 1:
            document.write("<h2>Sunday</h2>");
            break;
        case 2:
            document.write("<h2>Monday</h2>");
            break;
        case 3:
            document.write("<h2>Tuesday</h2>");
            break;
        case 4:
            document.write("<h2>Wednesday</h2>");
            break;
        case 5:
            document.write("<h2>Thursday</h2>");
            break;
        case 6:
            document.write("<h2>Friday</h2>");
            break;
        case 7:
            document.write("<h2>Saturday</h2>");
            break;
        default:
            document.write("<h2>Invalid input! Please enter 1 to 7.</h2>");
    }
</script>

</body>
</html>
