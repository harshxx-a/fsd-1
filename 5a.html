<!DOCTYPE html>
<html>
<head>
<style>

.namedColor{
color: purple;   /* color name */
}

.hexColor{
color: #FF69B4;   /* HEX value */
}

.rgbColor{
color: rgb(75,0,130);  /* RGB value */
}

.hslColor{
color: hsl(300, 100%, 50%);  /* HSL value */
}

</style>
</head>

<body>

<h1 class="namedColor">BTS - Named Color</h1>
<h1 class="hexColor">BTS - HEX Color</h1>
<h1 class="rgbColor">BTS - RGB Color</h1>
<h1 class="hslColor">BTS - HSL Color</h1>

</body>
</html>
